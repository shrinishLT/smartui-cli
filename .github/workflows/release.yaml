name: Build and Publish

on:
  release:
     types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Remove pnpm-lock.yaml
      run: rm -rf pnpm-lock.yaml

    - name: Install pnpm
      run: npm install -g pnpm@10

    - name: Update npm for OIDC trusted publishing (requires npm >= 11.5.1)
      run: npm install -g npm@11

    - name: Install dependencies
      run: pnpm install

    - name: Check if beta release
      id: check-beta
      run: |
        if [[ ${{ github.ref_name }} =~ -beta ]]; then
          echo "IS_BETA=true" >> $GITHUB_OUTPUT
        else
          echo "IS_BETA=false" >> $GITHUB_OUTPUT
        fi

    - name: Release beta package
      if: steps.check-beta.outputs.IS_BETA == 'true'
      run: |
        pnpm run build
        npm publish --tag beta --access public --provenance

    - name: Release stable package
      if: steps.check-beta.outputs.IS_BETA == 'false'
      run: |
        pnpm run build
        npm publish --access public --provenance
